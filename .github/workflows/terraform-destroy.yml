name: terraform-destroy

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type DESTROY to confirm'
        required: true
        default: ''

permissions:
  id-token: write
  contents: read

jobs:
  destroy:
    if: ${{ github.event.inputs.confirm == 'DESTROY' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform

    env:
      ARM_USE_OIDC: "true"
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      TF_IN_AUTOMATION: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.5"

      - name: Terraform Init
        run: |
          terraform init \
            -backend-config="resource_group_name=${{ secrets.TFSTATE_RG }}" \
            -backend-config="storage_account_name=${{ secrets.TFSTATE_SA }}" \
            -backend-config="container_name=${{ secrets.TFSTATE_CONTAINER }}" \
            -backend-config="key=${{ github.repository }}-main.tfstate"

      - name: Terraform Destroy (plan)
        run: |
          LOCATION="${{ vars.TF_LOCATION }}"
          PROJECT="${{ vars.TF_PROJECT }}"
          ENVNAME="${{ vars.TF_ENV }}"

          # fallbacks if repo variables are not defined
          [ -z "$LOCATION" ] && LOCATION="southindia"
          [ -z "$PROJECT" ] && PROJECT="agentic-rag"
          [ -z "$ENVNAME" ] && ENVNAME="dev"

          terraform plan -destroy -out=tfdestroy \
            -var="location=$LOCATION" \
            -var="project=$PROJECT" \
            -var="env=$ENVNAME" \
            -var="container_image=nginx:latest"

      - name: Terraform Destroy (apply)
        run: terraform apply -auto-approve tfdestroy

  blocked:
    if: ${{ github.event.inputs.confirm != 'DESTROY' }}
    runs-on: ubuntu-latest
    steps:
      - name: Confirmation required
        run: |
          echo "Refusing to run destroy. Re-run workflow and set input confirm=DESTROY."
          exit 1
