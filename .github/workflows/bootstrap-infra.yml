name: bootstrap-infra

on:
  workflow_dispatch: {}

permissions:
  id-token: write
  contents: read

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform
    env:
      ARM_USE_OIDC: "true"
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      TF_IN_AUTOMATION: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.5"

      - name: Terraform Init
        run: |
          terraform init \
            -backend-config="resource_group_name=${{ secrets.TFSTATE_RG }}" \
            -backend-config="storage_account_name=${{ secrets.TFSTATE_SA }}" \
            -backend-config="container_name=${{ secrets.TFSTATE_CONTAINER }}" \
            -backend-config="key=${{ github.repository }}-main.tfstate"

      - name: Debug storage.tf in runner
        run: |
          echo "=== terraform/storage.tf ==="
          sed -n '1,120p' storage.tf
          echo "=== occurrences of storage_account_name ==="
          grep -n "storage_account_name" -n storage.tf || true

      - name: Terraform Plan (bootstrap with temporary image)
        run: |
          LOCATION="${{ vars.TF_LOCATION }}"
          PROJECT="${{ vars.TF_PROJECT }}"
          ENVNAME="${{ vars.TF_ENV }}"

          # Fallbacks if repo variables are not defined
          [ -z "$LOCATION" ] && LOCATION="South India"
          [ -z "$PROJECT" ] && PROJECT="agentic-rag"
          [ -z "$ENVNAME" ] && ENVNAME="dev"

          terraform plan \
            -out=tfplan \
            -var="location=$LOCATION" \
            -var="project=$PROJECT" \
            -var="env=$ENVNAME" \
            -var="container_image=nginx:latest"      

      - name: Terraform Apply (bootstrap)
        run: terraform apply -auto-approve tfplan

      - name: Show outputs (for debugging)
        run: terraform output
