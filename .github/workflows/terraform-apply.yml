name: terraform-apply

on:
  workflow_dispatch: {}
  workflow_run:
    workflows: ["acr-build-push"]
    types: [completed]

permissions:
  id-token: write
  contents: read

jobs:
  apply:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform
    env:
      ARM_USE_OIDC: "true"
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      TF_IN_AUTOMATION: "true"

    steps:
      - name: Checkout (same commit that built the image)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.5"

      - name: Terraform Init
        run: |
          terraform init \
            -backend-config="resource_group_name=${{ secrets.TFSTATE_RG }}" \
            -backend-config="storage_account_name=${{ secrets.TFSTATE_SA }}" \
            -backend-config="container_name=${{ secrets.TFSTATE_CONTAINER }}" \
            -backend-config="key=${{ github.repository }}-main.tfstate"

      - name: Read ACR login server (for container_image var)
        id: tfout
        run: |
          ACR_LOGIN_SERVER="$(terraform output -raw acr_login_server)"
          echo "acr_login_server=$ACR_LOGIN_SERVER" >> "$GITHUB_OUTPUT"

      - name: Terraform Plan (real image)
        run: |
          terraform plan \
            -out=tfplan \
            -var="location=${{ vars.TF_LOCATION }}" \
            -var="project=${{ vars.TF_PROJECT }}" \
            -var="env=${{ vars.TF_ENV }}" \
            -var="container_image=${{ steps.tfout.outputs.acr_login_server }}/agent-api:${{ github.event.workflow_run.head_sha }}"

      - name: Terraform Apply
        run: terraform apply -auto-approve tfplan
