name: terraform-apply

on:
  workflow_dispatch:
    inputs:
      container_image:
        description: "Full ACR image tag to deploy (e.g. agenticragdevq7g5ye.azurecr.io/agent-api:<sha>)"
        required: false
        default: ""

permissions:
  id-token: write
  contents: read

jobs:
  
  terraform_apply:
    runs-on: ubuntu-latest
    env:
      ARM_USE_OIDC: "true"
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      TF_IN_AUTOMATION: "true"

    steps:
      # ── 1. Checkout ────────────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ── 2. Azure Login (OIDC — no client secret needed) ───────────────────
      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # ── 3. Setup Terraform ─────────────────────────────────────────────────
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.5"
          terraform_wrapper: false

      # ── 4. Terraform Init (remote backend) ────────────────────────────────
      - name: Terraform Init
        working-directory: terraform
        run: |
          terraform init \
            -backend-config="resource_group_name=${{ secrets.TFSTATE_RG }}" \
            -backend-config="storage_account_name=${{ secrets.TFSTATE_SA }}" \
            -backend-config="container_name=${{ secrets.TFSTATE_CONTAINER }}" \
            -backend-config="key=${{ github.repository }}-main.tfstate"

      # ── 5. Resolve container image ─────────────────────────────────────────
      # If manually supplied → use it.
      # If not supplied → read latest from ACR (most recently pushed tag).
      - name: Resolve container image
        id: image
        working-directory: terraform
        run: |
          INPUT_IMAGE="${{ github.event.inputs.container_image }}"
          if [ -n "$INPUT_IMAGE" ]; then
            echo "Using provided image: $INPUT_IMAGE"
            echo "container_image=$INPUT_IMAGE" >> "$GITHUB_OUTPUT"
          else
            echo "No image provided — reading acr_login_server from Terraform state..."
            ACR_LOGIN_SERVER="$(terraform output -raw acr_login_server)"
            ACR_NAME="$(echo "$ACR_LOGIN_SERVER" | cut -d. -f1)"
            LATEST_TAG=$(az acr repository show-tags \
              --name "$ACR_NAME" \
              --repository agent-api \
              --orderby time_desc \
              --top 1 \
              --output tsv)
            IMAGE="$ACR_LOGIN_SERVER/agent-api:$LATEST_TAG"
            echo "Resolved latest image: $IMAGE"
            echo "container_image=$IMAGE" >> "$GITHUB_OUTPUT"
          fi

      # ── 6. Terraform Plan ──────────────────────────────────────────────────
      - name: Terraform Plan
        working-directory: terraform
        run: |
          terraform plan \
            -var="container_image=${{ steps.image.outputs.container_image }}" \
            -out=tfplan \
            -input=false
      # ── Import existing resources that were created outside Terraform ──────
      - name: Terraform Import (idempotent)
        working-directory: terraform
        run: |
          # Import KV MI access policy if not already in state
          terraform state list | grep -q "azurerm_key_vault_access_policy.api_mi" || \
          terraform import \
            -var="container_image=placeholder" \
            azurerm_key_vault_access_policy.api_mi \
            "/subscriptions/${{ env.ARM_SUBSCRIPTION_ID }}/resourceGroups/agentic-rag-dev-rg/providers/Microsoft.KeyVault/vaults/agenticragdevkvq7g5ye/objectId/8796f439-40f6-4dbc-bfb0-dd1843dfb877"
        env:
          ARM_USE_OIDC: true
          ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}    

      # ── 7. Terraform Apply ─────────────────────────────────────────────────
      - name: Terraform Apply
        working-directory: terraform
        run: |
          terraform apply \
            -input=false \
            -auto-approve \
            tfplan

      # ── 8. Print key outputs ──────────────────────────────────────���────────
      - name: Print Terraform Outputs
        working-directory: terraform
        run: |
          echo "============================================"
          echo "Container App FQDN:"
          terraform output -raw container_app_fqdn
          echo ""
          echo "ACR Login Server:"
          terraform output -raw acr_login_server
          echo ""
          echo "Image deployed:"
          echo "${{ steps.image.outputs.container_image }}"
          echo "============================================"
